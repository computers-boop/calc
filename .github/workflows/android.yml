name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Setup Java
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '21''11'
        distribution: 'temurin'
     - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      - name: Build with Gradle
      run: ./gradlew build
